<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Formularios Conexión Glocal</title>
  </head>
  <body>
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="language" />
    </form>

    <form name="brand-dna" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="url" type="url" />
      <input name="name" />
      <input name="contact" />
      <input name="language" />
    </form>

    <form name="newsletter" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
      <input name="language" />
    </form>
  </body>
</html>
